name: Release a library

# Builds a library under packages/ from its <prefix>-v<version> tag and
# publishes the wheel as that tag's release, for products to pin by URL; their
# locks carry its SHA-256. The wheel is built twice and must come out the same
# both times, so anyone can rebuild the tag and check it against what shipped.
#
# Each library has one tag pattern below and one arm in "Name the library":
#   module-signing-v<version>  packages/tapio-module-signing
#   update-check-v<version>    packages/tapio-update-check
on:
  push:
    tags:
      - "module-signing-v*"
      - "update-check-v*"

permissions: {}

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      package: ${{ steps.library.outputs.package }}
      version: ${{ steps.library.outputs.version }}
      wheel: ${{ steps.build.outputs.wheel }}
      sha256: ${{ steps.build.outputs.sha256 }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      # A table, not a rule: a tag names exactly the library it was made for,
      # and one that names none stops here.
      - name: Name the library
        id: library
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          case "$TAG" in
            module-signing-v*) package=tapio-module-signing; prefix=module-signing-v ;;
            update-check-v*) package=tapio-update-check; prefix=update-check-v ;;
            *) echo "::error::$TAG names no library"; exit 1 ;;
          esac
          echo "package=$package" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#"$prefix"}" >> "$GITHUB_OUTPUT"

      - name: Install hashed build and test dependencies
        env:
          PACKAGE: ${{ steps.library.outputs.package }}
        run: |
          python -m pip install --require-hashes -r requirements.txt \
            -r "packages/$PACKAGE/requirements.txt"

      # A release is of something already on main: a tag pushed from a branch
      # nobody reviewed would otherwise publish whatever that branch held.
      - name: Check the tag is on main
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME is not on main"
            exit 1
          fi

      - name: Build the wheel twice
        id: build
        env:
          TAG: ${{ github.ref_name }}
          PACKAGE: ${{ steps.library.outputs.package }}
          VERSION: ${{ steps.library.outputs.version }}
        run: |
          set -euo pipefail
          export SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          for out in first second; do
            rm -rf "packages/$PACKAGE/build" "packages/$PACKAGE"/src/*.egg-info
            python -m pip wheel --no-deps --no-build-isolation -w "dist/$out" "./packages/$PACKAGE"
          done
          wheel="${PACKAGE//-/_}-${VERSION}-py3-none-any.whl"
          if [[ ! -f "dist/first/$wheel" ]]; then
            echo "::error::$TAG builds $(ls dist/first), not $wheel: is __version__ $VERSION?"
            exit 1
          fi
          cmp "dist/first/$wheel" "dist/second/$wheel"
          mkdir -p dist/release
          cp "dist/first/$wheel" dist/release/
          echo "wheel=$wheel" >> "$GITHUB_OUTPUT"
          echo "sha256=$(sha256sum "dist/release/$wheel" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      # From the wheel, so a module left out of it fails here, not in a product.
      - name: Test the wheel as installed
        env:
          PACKAGE: ${{ steps.library.outputs.package }}
        run: |
          python -m pip install --no-deps dist/release/*.whl
          cd "packages/$PACKAGE/tests"
          python -m unittest discover -v

      - name: Hand the wheel on
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: library-wheel
          path: dist/release/
          retention-days: 1

  # Separate from building, so the job that runs the build and its tests holds
  # no token that can write to the repository.
  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Take the wheel
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: library-wheel
          path: dist

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE: ${{ needs.build.outputs.package }}
          VERSION: ${{ needs.build.outputs.version }}
          REPO: ${{ github.repository }}
          SERVER: ${{ github.server_url }}
          SHA256: ${{ needs.build.outputs.sha256 }}
          TAG: ${{ github.ref_name }}
          WHEEL: ${{ needs.build.outputs.wheel }}
        run: |
          set -euo pipefail
          echo "$SHA256  dist/$WHEEL" | sha256sum --check
          # The tag still names the commit that was checked and built: one
          # moved since would publish this wheel under a commit nobody built.
          tagged=$(gh api "repos/$REPO/commits/$TAG" --jq .sha)
          if [[ "$tagged" != "$GITHUB_SHA" ]]; then
            echo "::error::$TAG now names $tagged, not the $GITHUB_SHA that was built"
            exit 1
          fi
          {
            echo "$PACKAGE $VERSION."
            echo
            echo "Pin it in requirements.in, without a hash:"
            echo
            echo '```'
            echo "$PACKAGE @ $SERVER/$REPO/releases/download/$TAG/$WHEEL"
            echo '```'
            echo
            echo "SHA-256 \`$SHA256\`, which the compiled lock will carry."
          } > notes.md
          gh release create "$TAG" "dist/$WHEEL" --repo "$REPO" --verify-tag \
            --title "$PACKAGE $VERSION" --notes-file notes.md
