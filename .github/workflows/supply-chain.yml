name: Supply Chain

on:
  push:
    branches: [main]
  pull_request:
    branches:
      - '**'
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sbom-and-audit:
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate dependencies and generate source evidence
        uses: ./actions/python-supply-chain
        with:
          config: build-tooling.toml
          product: tapio-build-tooling
          requirement-group: tooling
          output: dist/tapio-build-tooling-${{ github.sha }}-source.cdx.json
          platform: source
          audit: "true"
          upload-name: tapio-build-tooling-source-sbom

  # tapio-module-signing's own lock, which only its tests install: products
  # resolve its dependency in their own locks, where their audits cover it.
  module-signing-audit:
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Check and audit the library's test dependencies
        uses: ./actions/python-release-checks
        with:
          config: build-tooling.toml
          requirement-group: module-signing
          lock-check: "false"

  # tapio-update-check's own lock, for the same reason.
  update-check-audit:
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Check and audit the library's test dependencies
        uses: ./actions/python-release-checks
        with:
          config: build-tooling.toml
          requirement-group: update-check
          lock-check: "false"
