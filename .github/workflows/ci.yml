name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install hashed tooling dependencies
        run: |
          python -m pip install --require-hashes -r requirements.txt \
            -r packages/tapio-module-signing/requirements.txt \
            -r packages/tapio-update-check/requirements.txt
          python -m pip install --no-deps --no-build-isolation . ./packages/tapio-module-signing \
            ./packages/tapio-update-check

      - name: Validate package
        run: |
          tapio-build --project . config validate
          tapio-build --project . python requirements compile --check
          python -m unittest discover -v

      # From the installed package, not the source tree, so a module left out
      # of the wheel fails here rather than in a product.
      - name: Test tapio-module-signing
        working-directory: packages/tapio-module-signing/tests
        run: python -m unittest discover -v

      - name: Test tapio-update-check
        working-directory: packages/tapio-update-check/tests
        run: python -m unittest discover -v
