schema-version = 1

[organization]
name = "Tapio Measurement Technologies Oy"
website = "https://www.tapiotechnologies.com"

[products.tapio-analysis]
name = "Tapio Analysis"
license-id = "GPL-3.0-or-later"
repository = "https://github.com/Tapio-Measurement-Technologies/tapio-analysis"

[ecosystems.python]
version = "3.12"

[[ecosystems.python.requirements]]
name = "combined"
lock = "requirements.txt"


# A GPL program: the tagged source tree is published next to the binary, and
# the page carries the written offer. The signed executable is served as it is.
[downloads]
contact = "downloads@example.com"
logo = "src/assets/Tapio_Logo_300dpi.png"

[downloads.programs.tapio-analysis]
slug = "tapio-analysis"
name = "Tapio Analysis"
source-package = true
indexable = true
notes = "There is nothing to install: save the program anywhere and run it."

[[downloads.programs.tapio-analysis.assets]]
os = "windows"
glob = "dist/tapio-analysis-${version}.exe"
archive = "none"
sbom = "dist/tapio-analysis-${version}.cdx.json"
