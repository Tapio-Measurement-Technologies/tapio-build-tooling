[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tapio-module-signing"
dynamic = ["version"]
description = "Verify, build and load signed modules: code a Tapio product loads at runtime"
readme = "README.md"
requires-python = ">=3.12"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [
  { name = "Tapio Measurement Technologies Oy" },
]
dependencies = [
  "cryptography>=42",
]

[tool.setuptools.dynamic]
version = { attr = "tapio_module_signing.__version__" }

[tool.setuptools.packages.find]
where = ["src"]
