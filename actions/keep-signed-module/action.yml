name: Keep signed module
description: Keep signed files and their signing record as the module version's pre-release, refusing different content under a version already issued

inputs:
  files:
    description: The signed file(s) to keep; a glob, relative to the workspace
    required: true
  record:
    description: The record the sign-module action wrote
    default: signing-record.json
  tag-prefix:
    description: Tags are <prefix>/<id>/v<version>
    required: true
  kind:
    description: What the product calls a module, for the release title
    required: true
  token:
    description: Token that may create releases in this repository
    default: ${{ github.token }}

runs:
  using: composite
  steps:
    - name: Install build tooling from hashed lock
      shell: bash
      env:
        TOOLING_ROOT: ${{ github.action_path }}/../..
      run: |
        python -m pip install --require-hashes -r "$TOOLING_ROOT/requirements.txt"
        python -m pip install --no-deps --no-build-isolation "$TOOLING_ROOT"

    - name: Keep as a pre-release
      shell: bash
      env:
        FILES: ${{ inputs.files }}
        GH_TOKEN: ${{ inputs.token }}
        KIND: ${{ inputs.kind }}
        RECORD: ${{ inputs.record }}
        TAG_PREFIX: ${{ inputs.tag-prefix }}
      run: |
        set -euo pipefail
        shopt -s nullglob
        # Unquoted on purpose: FILES is a glob.
        files=($FILES)
        if (( ${#files[@]} == 0 )); then
          echo "::error::no file matches $FILES"
          exit 1
        fi
        tapio-build signing keep --record "$RECORD" --tag-prefix "$TAG_PREFIX" \
          --kind "$KIND" "${files[@]}"
