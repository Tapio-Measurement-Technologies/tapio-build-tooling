name: Container supply-chain evidence
description: Write a CycloneDX SBOM of a locally built image with syft, upload it, and fail on fixable vulnerabilities grype finds in it

inputs:
  config:
    description: Configuration path relative to project root
    default: build-tooling.toml
  image:
    description: Image reference in the job's Docker daemon, built earlier in the job; no registry is asked for it
    required: true
  product:
    description: Product ID named as the SBOM's subject; empty names the image
    default: ""
  version:
    description: Image version recorded in the SBOM; defaults to a commit-derived local version
    default: ""
  output:
    description: CycloneDX SBOM output path
    default: dist/image.cdx.json
  report:
    description: grype JSON report output path
    default: dist/image-vulnerabilities.json
  fail-on:
    description: Lowest severity with a fix available that fails the scan; empty uses container.fail-on, high by default
    default: ""
  scan:
    description: Scan the image with grype after writing its SBOM
    default: "true"
  upload-name:
    description: Uploaded SBOM artifact name; the scan report is uploaded as <name>-vulnerabilities
    default: image-sbom
  python-version:
    description: Python version used to run build tooling
    default: "3.12"

outputs:
  sbom-file:
    description: The CycloneDX SBOM
    value: ${{ steps.sbom.outputs.sbom-file }}
  report-file:
    description: grype's JSON report; empty when the scan did not run
    value: ${{ steps.scan.outputs.report-file }}

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install build tooling from hashed lock
      shell: bash
      env:
        TOOLING_ROOT: ${{ github.action_path }}/../..
      run: |
        python -m pip install --require-hashes -r "$TOOLING_ROOT/requirements.txt"
        python -m pip install --no-deps --no-build-isolation "$TOOLING_ROOT"

    - name: Validate supply-chain configuration
      shell: bash
      env:
        CONFIG: ${{ inputs.config }}
      run: tapio-build --project "$GITHUB_WORKSPACE" --config "$CONFIG" config validate

    # From the tools' GitHub releases at the versions the tooling pins; each
    # archive and each binary is checked against its SHA-256 before use.
    - name: Download and verify syft and grype
      shell: bash
      env:
        CONFIG: ${{ inputs.config }}
      run: tapio-build --project "$GITHUB_WORKSPACE" --config "$CONFIG" container tools --tools "$RUNNER_TEMP/tapio-container-tools"

    - name: Write the image SBOM
      id: sbom
      shell: bash
      env:
        CONFIG: ${{ inputs.config }}
        IMAGE: ${{ inputs.image }}
        OUTPUT: ${{ inputs.output }}
        PRODUCT: ${{ inputs.product }}
        VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail
        if [[ -z "$VERSION" ]]; then VERSION="0.0.0+${GITHUB_SHA:0:12}"; fi
        args=(--image "$IMAGE" --output "$OUTPUT" --version "$VERSION"
              --syft-output "$RUNNER_TEMP/tapio-container-tools/image.syft.json"
              --tools "$RUNNER_TEMP/tapio-container-tools")
        if [[ -n "$PRODUCT" ]]; then args+=(--product "$PRODUCT"); fi
        cd "$GITHUB_WORKSPACE"
        tapio-build --project "$GITHUB_WORKSPACE" --config "$CONFIG" container sbom "${args[@]}"
        echo "sbom-file=$(realpath "$OUTPUT")" >> "$GITHUB_OUTPUT"

    - name: Upload image SBOM
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: ${{ inputs.upload-name }}
        path: ${{ inputs.output }}
        if-no-files-found: error

    - name: Scan the image
      id: scan
      if: ${{ inputs.scan == 'true' }}
      shell: bash
      env:
        CONFIG: ${{ inputs.config }}
        FAIL_ON: ${{ inputs.fail-on }}
        IMAGE: ${{ inputs.image }}
        REPORT: ${{ inputs.report }}
      run: |
        set -euo pipefail
        args=(--sbom "$RUNNER_TEMP/tapio-container-tools/image.syft.json" --report "$REPORT"
              --image "$IMAGE" --tools "$RUNNER_TEMP/tapio-container-tools")
        if [[ -n "$FAIL_ON" ]]; then args+=(--fail-on "$FAIL_ON"); fi
        cd "$GITHUB_WORKSPACE"
        echo "report-file=$(realpath -m "$REPORT")" >> "$GITHUB_OUTPUT"
        tapio-build --project "$GITHUB_WORKSPACE" --config "$CONFIG" container scan "${args[@]}"

    # Kept when the scan fails too: it is what says why.
    - name: Upload scan report
      if: ${{ !cancelled() && inputs.scan == 'true' }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: ${{ inputs.upload-name }}-vulnerabilities
        path: ${{ inputs.report }}
        if-no-files-found: warn
