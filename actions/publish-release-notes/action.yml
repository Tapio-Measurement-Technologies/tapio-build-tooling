name: Publish release notes
description: Put a GitHub release's notes on the version's download pages, so an edit to the release shows on the site

inputs:
  config:
    description: Configuration path relative to project root
    default: build-tooling.toml
  version:
    description: Release tag whose notes changed
    required: true
  notes-file:
    description: File holding the notes as Markdown; an empty file clears them
    required: true
  bucket:
    description: S3 bucket name; keep it in a repository variable
    required: true
  aws-role-to-assume:
    description: IAM role ARN assumed through OIDC before publishing; empty uses the credentials already in the environment
    default: ""
  aws-region:
    description: AWS region for the role and the aws CLI
    default: ""
  programs:
    description: Space-separated program IDs; empty means every configured program
    default: ""
  dry-run:
    description: Read the bucket and render the pages, upload nothing
    default: "false"

runs:
  using: composite
  steps:
    - name: Install build tooling from hashed lock
      shell: bash
      env:
        TOOLING_ROOT: ${{ github.action_path }}/../..
      run: |
        python -m pip install --require-hashes -r "$TOOLING_ROOT/requirements.txt"
        python -m pip install --no-deps --no-build-isolation "$TOOLING_ROOT"

    - name: Validate downloads configuration
      shell: bash
      env:
        CONFIG: ${{ inputs.config }}
      run: tapio-build --project "$GITHUB_WORKSPACE" --config "$CONFIG" config validate

    - name: Authenticate to AWS
      if: ${{ inputs.aws-role-to-assume != '' }}
      uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c
      with:
        role-to-assume: ${{ inputs.aws-role-to-assume }}
        aws-region: ${{ inputs.aws-region }}

    # A version the site never published - a pre-release, or one older than
    # the site - is reported and left alone; the notes were edited for
    # reasons of their own.
    - name: Put the notes on the pages
      shell: bash
      env:
        AWS_REGION_INPUT: ${{ inputs.aws-region }}
        BUCKET: ${{ inputs.bucket }}
        CONFIG: ${{ inputs.config }}
        DRY_RUN: ${{ inputs.dry-run }}
        NOTES_FILE: ${{ inputs.notes-file }}
        PROGRAMS: ${{ inputs.programs }}
        VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail
        args=(--version "$VERSION" --notes-file "$NOTES_FILE" --bucket "$BUCKET" --output-dir "$RUNNER_TEMP/tapio-notes")
        for program in $PROGRAMS; do args+=(--program "$program"); done
        if [[ -n "$AWS_REGION_INPUT" ]]; then args+=(--aws-region "$AWS_REGION_INPUT"); fi
        if [[ "$DRY_RUN" == "true" ]]; then args+=(--dry-run); fi
        tapio-build --project "$GITHUB_WORKSPACE" --config "$CONFIG" downloads notes "${args[@]}" | tee -a "$GITHUB_STEP_SUMMARY"
