name: Publish release downloads
description: Package a release's files, record them in the program's manifest and publish the static download pages to an S3 bucket

inputs:
  config:
    description: Configuration path relative to project root
    default: build-tooling.toml
  version:
    description: Release tag; a hyphen in it marks a pre-release, which is not published
    required: true
  bucket:
    description: S3 bucket name; keep it in a repository variable
    required: true
  base-url:
    description: Public URL of the bucket root, no trailing slash; keep it in a repository variable
    required: true
  aws-role-to-assume:
    description: IAM role ARN assumed through OIDC before publishing; empty uses the credentials already in the environment
    default: ""
  aws-region:
    description: AWS region for the role and the aws CLI
    default: ""
  programs:
    description: Space-separated program IDs to publish; empty publishes every configured program
    default: ""
  root-index:
    description: Also write the bucket-root index of every program; needs write access to the bucket root
    default: "false"
  force:
    description: Replace a version that is already published with different files
    default: "false"
  dry-run:
    description: Package and render, list the uploads, upload nothing
    default: "false"
  output-dir:
    description: Where the site tree, summary and release notes are written; a directory under the runner's temp by default
    default: ""
  upload-name:
    description: Upload the output directory as a workflow artifact under this name; empty skips it
    default: ""

outputs:
  published:
    description: "true when the release was published (or would have been, on a dry run)"
    value: ${{ steps.publish.outputs.published || 'false' }}
  prerelease:
    description: "true when the version is a pre-release and nothing was published"
    value: ${{ steps.classify.outputs.prerelease }}
  latest:
    description: "true when this release is the newest of every published program"
    value: ${{ steps.publish.outputs.latest || 'false' }}
  page-urls:
    description: Space-separated permanent download page URLs, one per program
    value: ${{ steps.publish.outputs.page-urls }}
  release-notes-file:
    description: Markdown linking every published file; for a pre-release, a note saying nothing was published
    value: ${{ steps.publish.outputs.release-notes-file || steps.unpublished.outputs.release-notes-file }}
  summary-file:
    description: JSON summary of what was published
    value: ${{ steps.publish.outputs.summary-file }}

runs:
  using: composite
  steps:
    - name: Install build tooling from hashed lock
      shell: bash
      env:
        TOOLING_ROOT: ${{ github.action_path }}/../..
      run: |
        python -m pip install --require-hashes -r "$TOOLING_ROOT/requirements.txt"
        python -m pip install --no-deps --no-build-isolation "$TOOLING_ROOT"

    - name: Validate downloads configuration
      shell: bash
      env:
        CONFIG: ${{ inputs.config }}
      run: tapio-build --project "$GITHUB_WORKSPACE" --config "$CONFIG" config validate

    # The tag says what kind of build this is. A hyphen - v1.3.0-beta.1 - is a
    # pre-release: it stays on the GitHub release and never reaches the public
    # bucket.
    - name: Classify the release
      id: classify
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
        OUTPUT_DIR: ${{ inputs.output-dir }}
      run: |
        set -euo pipefail
        if [[ "$VERSION" != "${VERSION%%-*}" ]]; then
          echo "prerelease=true" >> "$GITHUB_OUTPUT"
        else
          echo "prerelease=false" >> "$GITHUB_OUTPUT"
        fi
        if [[ -z "$OUTPUT_DIR" ]]; then OUTPUT_DIR="$RUNNER_TEMP/tapio-downloads"; fi
        mkdir -p "$OUTPUT_DIR"
        echo "output-dir=$OUTPUT_DIR" >> "$GITHUB_OUTPUT"

    - name: Authenticate to AWS
      if: ${{ steps.classify.outputs.prerelease != 'true' && inputs.aws-role-to-assume != '' }}
      uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c
      with:
        role-to-assume: ${{ inputs.aws-role-to-assume }}
        aws-region: ${{ inputs.aws-region }}

    - name: Publish the release
      if: ${{ steps.classify.outputs.prerelease != 'true' }}
      id: publish
      shell: bash
      env:
        AWS_REGION_INPUT: ${{ inputs.aws-region }}
        BASE_URL: ${{ inputs.base-url }}
        BUCKET: ${{ inputs.bucket }}
        CONFIG: ${{ inputs.config }}
        DRY_RUN: ${{ inputs.dry-run }}
        FORCE: ${{ inputs.force }}
        OUTPUT_DIR: ${{ steps.classify.outputs.output-dir }}
        PROGRAMS: ${{ inputs.programs }}
        ROOT_INDEX: ${{ inputs.root-index }}
        VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail
        args=(--version "$VERSION" --bucket "$BUCKET" --base-url "$BASE_URL"
              --output-dir "$OUTPUT_DIR" --commit "$GITHUB_SHA")
        for program in $PROGRAMS; do args+=(--program "$program"); done
        if [[ -n "$AWS_REGION_INPUT" ]]; then args+=(--aws-region "$AWS_REGION_INPUT"); fi
        if [[ "$DRY_RUN" == "true" ]]; then args+=(--dry-run); fi
        if [[ "$FORCE" == "true" ]]; then args+=(--force); fi
        if [[ "$ROOT_INDEX" == "true" ]]; then args+=(--root-index); fi
        tapio-build --project "$GITHUB_WORKSPACE" --config "$CONFIG" downloads publish "${args[@]}"

        summary="$OUTPUT_DIR/summary.json"
        {
          echo "published=true"
          echo "latest=$(jq -r '.latest' "$summary")"
          echo "page-urls=$(jq -r '.page_urls | join(" ")' "$summary")"
          echo "release-notes-file=$OUTPUT_DIR/release-notes.md"
          echo "summary-file=$summary"
        } >> "$GITHUB_OUTPUT"
        cat "$OUTPUT_DIR/release-notes.md" >> "$GITHUB_STEP_SUMMARY"

    # A caller edits the release notes from the file either way, so a
    # pre-release gets notes that say why there are no download links.
    - name: Say that a pre-release is not published
      if: ${{ steps.classify.outputs.prerelease == 'true' }}
      id: unpublished
      shell: bash
      env:
        OUTPUT_DIR: ${{ steps.classify.outputs.output-dir }}
        VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail
        notes="$OUTPUT_DIR/release-notes.md"
        printf 'Pre-release. %s is attached to this GitHub release only; it is not published to the public download pages and is not offered as the latest version.\n' "$VERSION" > "$notes"
        echo "release-notes-file=$notes" >> "$GITHUB_OUTPUT"
        cat "$notes" >> "$GITHUB_STEP_SUMMARY"

    - name: Upload the site tree
      if: ${{ inputs.upload-name != '' }}
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: ${{ inputs.upload-name }}
        path: ${{ steps.classify.outputs.output-dir }}
        if-no-files-found: error
