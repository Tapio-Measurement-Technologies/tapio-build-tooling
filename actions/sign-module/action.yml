name: Sign module
description: Sign one module with a key in Azure Key Vault, verify it against the product's pinned keys, and record it

inputs:
  builder:
    description: The product's builder command line, answering manifest, digest, pack and verify
    required: true
  source:
    description: The module's source directory, relative to the workspace
    required: true
  output:
    description: The signed file to write
    required: true
  vault:
    description: Key Vault name; keep it in an environment variable
    required: true
  key-name:
    description: The key's name in the vault; keep it in an environment variable
    required: true
  key-id:
    description: The name the product pins the key by; the key name by default
    default: ""
  expect-id:
    description: Fail unless the signed module verifies as this id, e.g. its source directory's name
    default: ""
  created:
    description: ISO-8601 timestamp for the manifest, for a reproducible build
    default: ""
  record:
    description: Where the record of what was signed is written, as JSON
    default: signing-record.json
  azure-client-id:
    description: The signing identity's client ID; empty uses the az login already in place
    default: ""
  azure-tenant-id:
    description: The signing identity's tenant ID
    default: ""
  azure-subscription-id:
    description: The subscription the vault is in
    default: ""

outputs:
  record:
    description: Path of the record of what was signed
    value: ${{ inputs.record }}

runs:
  using: composite
  steps:
    - name: Install build tooling from hashed lock
      shell: bash
      env:
        TOOLING_ROOT: ${{ github.action_path }}/../..
      run: |
        python -m pip install --require-hashes -r "$TOOLING_ROOT/requirements.txt"
        python -m pip install --no-deps --no-build-isolation "$TOOLING_ROOT"

    # The job's own OIDC token, exchanged for the signing identity. The
    # identity trusts one environment of one repository and may sign with
    # one key, so the token is all a run needs and nothing it could keep.
    - name: Authenticate to Azure
      if: ${{ inputs.azure-client-id != '' }}
      uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5
      with:
        client-id: ${{ inputs.azure-client-id }}
        tenant-id: ${{ inputs.azure-tenant-id }}
        subscription-id: ${{ inputs.azure-subscription-id }}

    - name: Sign, verify and record
      shell: bash
      env:
        BUILDER: ${{ inputs.builder }}
        CREATED: ${{ inputs.created }}
        EXPECT_ID: ${{ inputs.expect-id }}
        KEY_ID: ${{ inputs.key-id }}
        KEY_NAME: ${{ inputs.key-name }}
        OUTPUT: ${{ inputs.output }}
        RECORD: ${{ inputs.record }}
        SOURCE: ${{ inputs.source }}
        VAULT: ${{ inputs.vault }}
      run: |
        set -euo pipefail
        args=(--builder "$BUILDER" --source "$SOURCE" --output "$OUTPUT"
              --vault "$VAULT" --key-name "$KEY_NAME" --record "$RECORD"
              --summary "$GITHUB_STEP_SUMMARY")
        if [[ -n "$KEY_ID" ]]; then args+=(--key-id "$KEY_ID"); fi
        if [[ -n "$EXPECT_ID" ]]; then args+=(--expect-id "$EXPECT_ID"); fi
        if [[ -n "$CREATED" ]]; then args+=(--created "$CREATED"); fi
        tapio-build signing sign "${args[@]}"
